<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Bank Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🏦 Smart Bank Management System</h1>

        <button id="themeBtn">
            🌙 Dark Mode
        </button>
    </header>

    <div class="container">

        <!-- Create Account -->

        <section class="card">

            <h2>Create Account</h2>

            <input type="text" id="name" placeholder="Customer Name">

            <input type="password" id="pin" maxlength="4" placeholder="4 Digit PIN">

            <input type="number" id="balance" placeholder="Opening Balance">

            <button id="createBtn">
                Create Account
            </button>

        </section>

        <!-- Login -->

        <section class="card">

            <h2>Login</h2>

            <input type="number" id="accNo" placeholder="Account Number">

            <input type="password" id="loginPin" placeholder="PIN">

            <button id="loginBtn">
                Login
            </button>

        </section>

        <!-- Dashboard -->

        <section class="card" id="dashboard">

            <h2>Account Dashboard</h2>

            <p>
                <b>Name :</b>
                <span id="showName">-</span>
            </p>

            <p>
                <b>Account No :</b>
                <span id="showAcc">-</span>
            </p>

            <p>
                <b>Balance :</b>
                ₹ <span id="showBalance">0</span>
            </p>

            <hr>

            <h3>Deposit</h3>

            <input type="number" id="depositAmount">

            <button id="depositBtn">
                Deposit
            </button>

            <hr>

            <h3>Withdraw</h3>

            <input type="number" id="withdrawAmount">

            <button id="withdrawBtn">
                Withdraw
            </button>

            <hr>

            <h3>Transfer Money</h3>

            <input type="number" id="receiverAcc" placeholder="Receiver Account">

            <input type="number" id="transferAmount" placeholder="Amount">

            <button id="transferBtn">
                Transfer
            </button>

            <hr>

            <h3>Interest Calculator</h3>

            <input type="number" id="interestRate" placeholder="Interest %">

            <button id="interestBtn">
                Calculate Interest
            </button>

            <p id="interestResult"></p>

            <hr>

            <h3>Transaction History</h3>

            <ul id="history"></ul>

            <button id="downloadBtn">
                Download Statement
            </button>

        </section>

    </div>

    <script src="js/account.js"></script>

    <script src="js/transaction.js"></script>

    <script src="js/transfer.js"></script>

    <script src="js/interest.js"></script>

    <script src="js/darkmode.js"></script>

    <script src="js/statement.js"></script>

    <script src="js/app.js"></script>

</body>

</html>
